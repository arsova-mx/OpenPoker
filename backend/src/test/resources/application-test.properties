# MODE=PostgreSQL: H2 imita el motor de producción.
# NON_KEYWORDS=VALUE: la columna card_value.value es palabra reservada en H2 2.x (en PostgreSQL no).
spring.datasource.url=jdbc:h2:mem:openpoker_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=${JWT_SECRET:test-only-jwt-secret-that-is-at-least-32-bytes-long}
jwt.expiration-ms=86400000