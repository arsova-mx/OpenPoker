# MODE=PostgreSQL: H2 imita el motor de producción.
# NON_KEYWORDS=VALUE: la columna card_value.value es palabra reservada en H2 2.x (en PostgreSQL no).
spring.datasource.url=jdbc:h2:mem:openpoker_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Los tests también crean el esquema con las migraciones de Flyway: si una migración o una entidad
# no coinciden, la suite falla igual que fallaría el arranque en producción.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

server.port=8080

jwt.secret=${JWT_SECRET:test-only-jwt-secret-that-is-at-least-32-bytes-long}
jwt.expiration-ms=86400000
# Los tests de integración registran muchos usuarios desde la misma IP; RateLimitIntegrationTest lo activa
app.rate-limit.enabled=false
