# ── Application ──────────────────────────────────────────────────
spring.application.name=openpoker-backend
server.port=${SERVER_PORT:8080}

# ── DataSource (PostgreSQL) ───────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openpoker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:openpoker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:openpoker_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.openpoker=DEBUG
logging.level.org.springframework.web=INFO
