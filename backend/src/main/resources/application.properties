# MySQL Remoto (78.12.218.56:3306)
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST:78.12.218.56}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_NAME:openpoker_bd}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:apidev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:T2jBrJAs2Cs92Jax}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: 'update' para sincronizar entidades sin romper datos previos
spring.jpa.hibernate.ddl-auto=update

# Flyway desactivado para que no intente ejecutar migraciones incompatibles
spring.flyway.enabled=false

# Logs de SQL desactivados por defecto
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8080}

# Detrás de un proxy (nginx del frontend, Cloudflare)
server.forward-headers-strategy=native

# Orígenes CORS permitidos
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}

# Límites de intentos (Rate limiting)
app.rate-limit.enabled=true
app.rate-limit.login.capacity=10
app.rate-limit.login.period=1m
app.rate-limit.register.capacity=5
app.rate-limit.register.period=10m
app.rate-limit.guest-join.capacity=30
app.rate-limit.guest-join.period=1m
app.rate-limit.login-failures.capacity=5
app.rate-limit.login-failures.period=5m

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Respuestas de error por defecto de Spring: sin stack traces ni mensajes internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never