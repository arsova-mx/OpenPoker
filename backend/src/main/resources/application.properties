
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_NAME:openpoker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET:superSecretKeyForDevOnly2026OpenPokerApp!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Configuración para evitar mostrar stack traces en respuestas de error
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

