spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_NAME:openpoker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 1. CAMBIO: De 'update' a 'validate' para que Hibernate no altere las tablas a sus espaldas
spring.jpa.hibernate.ddl-auto=update

# 2. NUEVO: Configuración de Flyway para tomar el control de la BD
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Configuración para evitar mostrar stack traces en respuestas de error
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never
