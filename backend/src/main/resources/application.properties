# ── Application ──────────────────────────────────────────────────
spring.application.name=openpoker-backend
server.port=${SERVER_PORT:8080}

# ── DataSource (PostgreSQL) ───────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/OpenPoker_BD}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.openpoker=DEBUG
logging.level.org.springframework.web=INFO

jwt.secret=mi_clave_super_secreta_1234567890_abcd
jwt.expiration-ms=86400000

