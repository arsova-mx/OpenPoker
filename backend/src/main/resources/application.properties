
# PostgreSQL. Los valores por defecto son solo para desarrollo local (ver README).
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_NAME:openpoker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:openpoker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:openpoker}

# El esquema lo manejan las migraciones de Flyway (db/migration); Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# Las BD creadas antes con ddl-auto=update quedan registradas en V1 y reciben las migraciones siguientes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# El SQL en los logs se activa con el perfil "dev" (application-dev.properties)
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Respuestas de error por defecto de Spring: sin stack traces ni mensajes internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
