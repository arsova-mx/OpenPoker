# ── Application ──────────────────────────────────────────────────
spring.application.name=openpoker-backend
server.port=8080

# ── DataSource (PostgreSQL) ───────────────────────────────────────
# Override these values via environment variables in production:
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/openpoker
spring.datasource.username=openpoker
spring.datasource.password=openpoker_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.openpoker=DEBUG
logging.level.org.springframework.web=INFO
