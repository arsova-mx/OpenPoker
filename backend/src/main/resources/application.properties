
# PostgreSQL. Los valores por defecto son solo para desarrollo local (ver README).
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_NAME:openpoker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:openpoker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:openpoker}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Configuración para evitar mostrar stack traces en respuestas de error
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

