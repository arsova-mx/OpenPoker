spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_NAME:openpoker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 1. CAMBIO: De 'update' a 'validate' para que Hibernate no altere las tablas a sus espaldas
spring.jpa.hibernate.ddl-auto=update

# 2. NUEVO: Configuración de Flyway para tomar el control de la BD
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

# Detrás de un proxy (nginx del frontend, Cloudflare): Tomcat toma el esquema y el puerto públicos de
# X-Forwarded-Proto / X-Forwarded-Port, solo si vienen de una IP interna (redes privadas y loopback).
# Así una petición del mismo origen se reconoce como tal aunque el TLS termine antes del backend.
server.forward-headers-strategy=native

# Orígenes del frontend que pueden usar la API y el WebSocket desde el navegador (separados por coma).
# Acepta patrones, por ejemplo https://*.pages.dev. El mismo origen siempre se permite.
# Los valores por defecto cubren el desarrollo local (Vite y docker compose en el puerto 3000).
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}

# Límite de intentos (token bucket): "capacity" intentos seguidos que se recuperan a lo largo de "period".
# Por IP en login, registro y entrada de invitados; "login-failures" cuenta los fallos por username
# desde cualquier IP. Se ajustan por entorno, p. ej. APP_RATELIMIT_LOGIN_CAPACITY=20.
app.rate-limit.enabled=true
app.rate-limit.login.capacity=10
app.rate-limit.login.period=1m
app.rate-limit.register.capacity=5
app.rate-limit.register.period=10m
app.rate-limit.guest-join.capacity=30
app.rate-limit.guest-join.period=1m
app.rate-limit.login-failures.capacity=5
app.rate-limit.login-failures.period=5m

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Respuestas de error por defecto de Spring: sin stack traces ni mensajes internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
