<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket STOMP Tester (Guests Supported)</title>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        h2 { color: #569cd6; }
        input, button { padding: 8px; margin: 4px; border: 1px solid #555; background: #2d2d2d; color: #d4d4d4; border-radius: 4px; }
        input { width: 180px; }
        #jwtToken { width: 350px; border-color: #0e639c; }
        #guestName { border-color: #4ec9b0; }
        #ticketId { width: 280px; }
        #cardValue { width: 280px; }
        #timerDuration { width: 100px; border-color: #d7ba7d; }
        button { cursor: pointer; background: #0e639c; border: none; }
        button:hover { background: #1177bb; }
        #log { background: #111; padding: 12px; margin-top: 12px; max-height: 400px; overflow-y: auto; border-radius: 4px; white-space: pre-wrap; }
        .connected { color: #4ec9b0; }
        .error { color: #f44747; }
        .msg { color: #ce9178; }
        .sent { color: #dcdcaa; }
        .timer-warning { color: #d7ba7d; font-weight: bold; }
    </style>
</head>
<body>
    <h2>OpenPoker — WebSocket STOMP Tester</h2>

    <div>
        <label>Invite Code: <input id="inviteCode" value="" placeholder="ABC123"></label>
        <label>Token JWT (User): <input id="jwtToken" value="" placeholder="Bearer eyJhbGci..."></label>
    </div>
    <div style="margin-top: 8px;">
        <label>Username (Registered): <input id="username" value="" placeholder="testUser"></label>
        <label>Guest Name (Invitado): <input id="guestName" value="" placeholder="Carlos Guest"></label>
    </div>
    <div style="margin-top: 8px;">
        <label>Ticket ID (UUID): <input id="ticketId" value="" placeholder="uuid-del-ticket"></label>
        <label>Card Value (UUID): <input id="cardValue" value="" placeholder="uuid-de-la-carta"></label>
    </div>
    <div style="margin-top: 8px; background: #252526; padding: 8px; border-radius: 4px;">
        <label>Timer Duration (s): <input id="timerDuration" type="number" value="30" placeholder="Segundos"></label>
        <button style="background: #d7ba7d; color: #1e1e1e; font-weight: bold;" onclick="setTimer()">Set Timer</button>
    </div>
    <div style="margin-top:16px">
        <button onclick="connect()">Connect</button>
        <button onclick="joinSession()">Join Session</button>
        
        <button style="background: #a31515;" onclick="startTicketVoting()">Start Voting (PATCH)</button>
        
        <button onclick="voteSession()">Vote</button>
        <button onclick="revealVotes()">Reveal Votes</button>
        <button onclick="resetVotes()">Reset Votes</button>
        <button id="finishButton" onclick="finishSession()" disabled>Finish Session</button>
        <button onclick="leaveSession()">Leave Session</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>

    <div id="log"></div>

    <script>
        let stompClient = null;
        let lastSessionState = null;
        let lastParticipants = [];
        let countdownInterval = null;

        function log(msg, cls = '') {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            el.innerHTML += `<span class="${cls}">[${time}] ${msg}</span>\n`;
            el.scrollTop = el.scrollHeight;
        }

        function updateFinishButton() {
            const button = document.getElementById('finishButton');
            const usernameInput = document.getElementById('username').value.trim();
            const guestNameInput = document.getElementById('guestName').value.trim();
            const currentName = usernameInput || guestNameInput;

            const isHost = lastParticipants.some(p => {
                const pName = p.username || p.displayName || p.effectiveName || p.guestDisplayName;
                return pName === currentName && p.role === 'HOST';
            });

            button.disabled = !isHost;
        }

        function connect() {
            const ws = new WebSocket('ws://localhost:8080/ws-native', ['v12.stomp']);
            stompClient = Stomp.over(ws);

            let token = document.getElementById('jwtToken').value.trim();
            if (token && !token.startsWith('Bearer ')) {
                token = 'Bearer ' + token;
            }

            const headers = {};
            if (token) {
                headers['Authorization'] = token;
            }

            stompClient.connect(headers, function (frame) {
                log('CONNECTED: ' + frame, 'connected');

                const code = document.getElementById('inviteCode').value;
                if (code) {
                    stompClient.subscribe('/topic/session/' + code + '/participants', function (message) {
                        try {
                            lastParticipants = JSON.parse(message.body);
                        } catch (e) {
                            lastParticipants = [];
                        }
                        updateFinishButton();
                        log('RECEIVED participants: ' + message.body, 'msg');
                    });
                    stompClient.subscribe('/topic/session/' + code + '/votes', function (message) {
                        log('RECEIVED votes: ' + message.body, 'msg');
                    });
                    stompClient.subscribe('/topic/session/' + code + '/timer', function (message) {
                        log('RECEIVED timer: ' + message.body, 'timer-warning');
                        try {
                            const timerData = JSON.parse(message.body);
                            startLocalCountdown(timerData.timerExpiresAt);
                        } catch (e) {
                            log('Error parsing timer status', 'error');
                        }
                    });
                    stompClient.subscribe('/topic/session/' + code + '/vote-status', function (message) {
                        log('RECEIVED vote-status: ' + message.body, 'msg');
                    });
                    stompClient.subscribe('/topic/session/' + code + '/state', function (message) {
                        try {
                            lastSessionState = JSON.parse(message.body);
                        } catch (e) {
                            lastSessionState = null;
                        }
                        updateFinishButton();
                        log('RECEIVED state: ' + message.body, 'msg');
                        if (lastSessionState && lastSessionState.status === 'FINISHED') {
                            log('SESSION FINISHED: closing local connection', 'error');
                            disconnect();
                        }
                    });
                    stompClient.subscribe('/topic/session/' + code + '/errors', function (message) {
                        try {
                            const error = JSON.parse(message.body);
                            log('ERROR ' + error.action + ' [' + error.type + ']: ' + error.message, 'error');
                        } catch (e) {
                            log('ERROR payload: ' + message.body, 'error');
                        }
                    });
                    log('Subscribed to session topics for code: ' + code, 'connected');
                }
            }, function (error) {
                log('ERROR: ' + error, 'error');
            });
        }

        function joinSession() {
            if (!stompClient || !stompClient.connected) { log('Not connected!', 'error'); return; }
            
            const username = document.getElementById('username').value.trim();
            const guestName = document.getElementById('guestName').value.trim();
            const inviteCode = document.getElementById('inviteCode').value.trim();

            const payload = { inviteCode: inviteCode };

            if (guestName) {
                payload.guestName = guestName;
            } else if (username) {
                payload.username = username;
            } else {
                log('Error: Ingresa un Username o un Guest Name para unirte', 'error');
                return;
            }

            stompClient.send('/app/session.join', { 'content-type': 'application/json' }, JSON.stringify(payload));
            log('SENT join: ' + JSON.stringify(payload), 'sent');
        }

        function setTimer() {
            if (!stompClient || !stompClient.connected) { log('Not connected!', 'error'); return; }

            const ticketId = document.getElementById('ticketId').value.trim();
            const durationSeconds = document.getElementById('timerDuration').value.trim();

            if (!ticketId) {
                log('Error: Debes ingresar el Ticket ID para configurar el timer.', 'error');
                return;
            }

            const payload = {
                ticketId: ticketId,
                durationSeconds: durationSeconds ? parseInt(durationSeconds) : null
            };

            stompClient.send('/app/session.set-timer', { 'content-type': 'application/json' }, JSON.stringify(payload));
            log('SENT set-timer: ' + JSON.stringify(payload), 'sent');
        }

        function startLocalCountdown(expiresAtIso) {
            if (countdownInterval) clearInterval(countdownInterval);

            if (!expiresAtIso) {
                log('TIMER: Sin límite de tiempo (desactivado)', 'connected');
                return;
            }

            const targetTime = new Date(expiresAtIso).getTime();

            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetTime - now;

                if (distance <= 0) {
                    clearInterval(countdownInterval);
                    log('⚠️ TIEMPO AGOTADO - Votación finalizada en servidor', 'error');
                    return;
                }

                const secondsLeft = Math.ceil(distance / 1000);
                if (secondsLeft % 5 === 0 || secondsLeft <= 5) {
                    log(`⏳ Tiempo restante: ${secondsLeft}s`, secondsLeft <= 5 ? 'error' : 'timer-warning');
                }
            }, 1000);
        }

        function startTicketVoting() {
            const ticketId = document.getElementById('ticketId').value.trim();
            if (!ticketId) {
                log('Error: Debes ingresar el Ticket ID para iniciar la votación.', 'error');
                return;
            }

            let token = document.getElementById('jwtToken').value.trim();
            if (token && !token.startsWith('Bearer ')) {
                token = 'Bearer ' + token;
            }

            log('SEND PATCH -> Iniciando votación para ticket: ' + ticketId, 'sent');

            fetch(`http://localhost:8080/api/tickets/${ticketId}/status?newStatus=VOTING`, {
                method: 'PATCH',
                headers: {
                    'Authorization': token,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Código HTTP ' + response.status + ': ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                log('PATCH SUCCESS -> Ticket ahora está en VOTING: ' + JSON.stringify(data), 'connected');
            })
            .catch(error => {
                log('PATCH ERROR -> ' + error.message, 'error');
            });
        }

        function leaveSession() {
            if (!stompClient || !stompClient.connected) { log('Not connected!', 'error'); return; }
            const payload = {
                inviteCode: document.getElementById('inviteCode').value,
                username: document.getElementById('username').value,
                guestName: document.getElementById('guestName').value
            };
            stompClient.send('/app/session.leave', { 'content-type': 'application/json' }, JSON.stringify(payload));
            log('SENT leave: ' + JSON.stringify(payload), 'sent');
        }

        function voteSession() {
            if (!stompClient || !stompClient.connected) { log('Not connected!', 'error'); return; }

            const ticketInput = document.getElementById('ticketId').value.trim();
            const cardInput = document.getElementById('cardValue').value.trim();

            if (!ticketInput || !cardInput) {
                log('Error: Debes ingresar el Ticket ID y el Card Value', 'error');
                return;
            }

            const payload = {
                ticketId: ticketInput,
                cardValue: cardInput
            };
            stompClient.send('/app/session.vote', { 'content-type': 'application/json' }, JSON.stringify(payload));
            log('SENT vote: ' + JSON.stringify(payload), 'sent');
        }

        function revealVotes() {
            if (!stompClient || !stompClient.connected) { log('Not connected!', 'error'); return; }
            const ticketId = document.getElementById('ticketId').value;

            if (!ticketId) {
                log('Error: ticketId no encontrado en la UI', 'error');
                return;
            }

            const payload = {
                inviteCode: document.getElementById('inviteCode').value,
                ticketId: ticketId
            };
            stompClient.send('/app/session.reveal', { 'content-type': 'application/json' }, JSON.stringify(payload));
            log('SENT reveal: ' + JSON.stringify(payload), 'sent');
        }

        function resetVotes() {
            if (!stompClient || !stompClient.connected) { log('Not connected!', 'error'); return; }
            const ticketId = document.getElementById('ticketId').value.trim();

            if (!ticketId) {
                log('Error: Debes ingresar el Ticket ID para reiniciar la votación', 'error');
                return;
            }

            const payload = {
                inviteCode: document.getElementById('inviteCode').value,
                ticketId: ticketId
            };
            stompClient.send('/app/session.reset-votes', { 'content-type': 'application/json' }, JSON.stringify(payload));
            log('SENT reset votes: ' + JSON.stringify(payload), 'sent');
        }

        function finishSession() {
            if (!stompClient || !stompClient.connected) { log('Not connected!', 'error'); return; }

            const ticketId = document.getElementById('ticketId').value.trim();
            const inviteCode = document.getElementById('inviteCode').value.trim();

            if (!ticketId) {
                log('Error: Debes ingresar el Ticket ID para finalizar la estimación', 'error');
                return;
            }

            const payload = {
                inviteCode: inviteCode,
                ticketId: ticketId
            };

            stompClient.send('/app/session.finish', { 'content-type': 'application/json' }, JSON.stringify(payload));
            log('SENT finish ticket: ' + JSON.stringify(payload), 'sent');
        }

        function disconnect() {
            if (countdownInterval) clearInterval(countdownInterval);
            if (stompClient) {
                stompClient.disconnect(function () {
                    lastSessionState = null;
                    lastParticipants = [];
                    updateFinishButton();
                    log('DISCONNECTED', 'error');
                });
            }
        }
    </script>
</body>
</html>
