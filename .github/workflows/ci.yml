name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp clean verify

  backend-postgresql:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openpoker_tests
          POSTGRES_USER: openpoker
          POSTGRES_PASSWORD: openpoker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openpoker -d openpoker_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test against PostgreSQL 17
        run: >-
          ./mvnw -B -ntp clean verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/openpoker_tests
          -Dspring.datasource.username=openpoker
          -Dspring.datasource.password=openpoker
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

  frontend:
    name: Frontend (lint, type-check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type-check and build
        run: npm run build

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, backend-postgresql, frontend]
    env:
      POSTGRES_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v5
      - name: Generate an ephemeral JWT secret
        run: |
          secret="$(openssl rand -base64 48)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Run smoke test
        run: ./scripts/smoke-test.sh http://localhost:3000
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
