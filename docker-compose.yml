services:
  # ── Database (PostgreSQL) ──────────────────────────────────────
  # The port is not published on purpose. To reach PostgreSQL from your host during
  # development, add a compose.override.yml with: services.db.ports: ["5432:5432"]
  db:
    image: postgres:17-alpine
    container_name: openpoker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openpoker}
      POSTGRES_USER: ${POSTGRES_USER:-openpoker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── Backend (Spring Boot) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openpoker-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_HOST: db
      SPRING_DATASOURCE_PORT: 5432
      SPRING_DATASOURCE_NAME: ${POSTGRES_DB:-openpoker}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-openpoker}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (generate one with openssl rand -base64 48)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # Public endpoint: returns 200 once the app is up and the decks are seeded
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/card-decks || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── Frontend (React + Vite, served by nginx) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: openpoker-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  db_data:
