version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: openpoker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openpoker
      POSTGRES_USER: openpoker
      POSTGRES_PASSWORD: openpoker_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpoker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Spring Boot) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openpoker-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openpoker
      SPRING_DATASOURCE_USERNAME: openpoker
      SPRING_DATASOURCE_PASSWORD: openpoker_secret
    ports:
      - "8080:8080"

  # ── Frontend (React + Vite) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openpoker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
